<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Columbus Food Files</title>
<meta name="description" content="Years of notes on Columbus restaurants — what was good, who liked it, and whether it's worth going back.">
<meta name="theme-color" content="#f7f3ec">
<meta property="og:title" content="Columbus Food Files">
<meta property="og:description" content="Years of notes on Columbus restaurants — what was good, who liked it, and whether it's worth going back.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
<style>
  :root {
    --paper:#f7f3ec; --card:#fffdf9; --ink:#1f1b16; --soft:#6b6259; --faint:#a89e92;
    --rule:#e2dace; --accent:#b4451f; --accent-soft:#f0e0d6;
    --great:#2f6b3f; --good:#5c7a3a; --ok:#8a7320; --meh:#9a5a2a; --bad:#a33a2a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#14120f; --card:#1c1917; --ink:#eae4db; --soft:#a49a8d; --faint:#6f665b;
      --rule:#2e2925; --accent:#e27a4e; --accent-soft:#3a2820;
      --great:#7fc08d; --good:#a8c47e; --ok:#d6bb5e; --meh:#dc9a63; --bad:#e8827a;
    }
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body { background:var(--paper); color:var(--ink); font-family:var(--sans);
         font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:900px; margin:0 auto; padding:0 20px; }

  header { padding:44px 0 22px; }
  h1 { font-family:var(--serif); font-size:clamp(34px,7vw,52px); font-weight:400;
       letter-spacing:-.02em; line-height:1.05; }
  h1 .dot { color:var(--accent); }
  .blurb { color:var(--soft); margin-top:12px; max-width:56ch; font-size:15.5px; }
  .blurb b { color:var(--ink); font-weight:600; }

  /* --- controls --- */
  .controls { position:sticky; top:0; z-index:20; background:var(--paper);
              padding:14px 0 10px; border-bottom:1px solid var(--rule); }
  .searchrow { display:flex; gap:8px; align-items:center; }
  #q { flex:1; min-width:0; font:inherit; font-size:17px; color:var(--ink);
       background:var(--card); border:1px solid var(--rule); border-radius:10px;
       padding:12px 14px; outline:none; }
  #q:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #q::placeholder { color:var(--faint); }
  .btn { font:inherit; font-size:14px; color:var(--soft); background:var(--card);
         border:1px solid var(--rule); border-radius:10px; padding:12px 14px;
         cursor:pointer; white-space:nowrap; }
  .btn:hover { color:var(--ink); border-color:var(--faint); }

  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { font-size:13px; font-family:var(--sans); color:var(--soft);
          background:transparent; border:1px solid var(--rule); border-radius:999px;
          padding:4px 11px; cursor:pointer; white-space:nowrap; }
  .chip:hover { color:var(--ink); border-color:var(--faint); }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .chip .n { opacity:.5; margin-left:5px; font-variant-numeric:tabular-nums; }
  .grouplabel { font-size:11px; letter-spacing:.13em; text-transform:uppercase;
                color:var(--faint); align-self:center; margin-right:2px; }

  .count { color:var(--soft); font-size:13.5px; padding:14px 0 4px; }
  .count b { color:var(--ink); font-variant-numeric:tabular-nums; }

  /* --- cards --- */
  main { padding-bottom:80px; }
  .card { background:var(--card); border:1px solid var(--rule); border-radius:12px;
          padding:18px 20px; margin:12px 0; scroll-margin-top:120px; }
  .cardhead { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  .name { font-family:var(--serif); font-size:23px; font-weight:400; letter-spacing:-.01em; }
  .name a { color:inherit; text-decoration:none; }
  .name a:hover { color:var(--accent); }
  .verdict { font-size:11px; letter-spacing:.1em; text-transform:uppercase;
             font-weight:700; padding:3px 8px; border-radius:5px; color:#fff; }
  .v-great{background:var(--great)} .v-good{background:var(--good)}
  .v-ok{background:var(--ok)} .v-meh{background:var(--meh)} .v-bad{background:var(--bad)}
  @media (prefers-color-scheme: dark) { .verdict { color:#14120f; } }
  .closed { font-size:11px; letter-spacing:.1em; text-transform:uppercase;
            font-weight:700; padding:3px 8px; border-radius:5px;
            border:1px solid var(--faint); color:var(--faint); }

  .meta { display:flex; flex-wrap:wrap; gap:5px 8px; margin-top:8px;
          font-size:12.5px; color:var(--soft); align-items:center; }
  .tag { border:1px solid var(--rule); border-radius:999px; padding:2px 9px; }
  .tag.person { border-color:var(--accent); color:var(--accent); }
  .where { font-style:italic; }

  .notes { margin-top:13px; padding-top:13px; border-top:1px solid var(--rule);
           font-size:14.5px; color:var(--ink); white-space:pre-wrap;
           overflow-wrap:anywhere; }
  .notes.clamped { max-height:11.5em; overflow:hidden;
                   -webkit-mask-image:linear-gradient(#000 65%, transparent);
                   mask-image:linear-gradient(#000 65%, transparent); }
  .more { margin-top:8px; font-size:13px; color:var(--accent); background:none;
          border:none; padding:0; cursor:pointer; font-family:var(--sans); }
  .more:hover { text-decoration:underline; }
  mark { background:var(--accent-soft); color:inherit; border-radius:2px; padding:0 1px; }
  .notes a { color:var(--accent); }

  .empty { text-align:center; color:var(--soft); padding:60px 20px; }
  .empty b { display:block; font-family:var(--serif); font-size:22px;
             color:var(--ink); margin-bottom:6px; }

  footer { border-top:1px solid var(--rule); padding:26px 0 60px;
           color:var(--faint); font-size:13px; }
  footer a { color:var(--soft); }

  @media (max-width:560px) {
    header { padding:30px 0 16px; }
    .card { padding:15px 16px; }
    .grouplabel { display:none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Columbus Food Files<span class="dot">.</span></h1>
    <p class="blurb">
      Years of C.'s notes on eating in Columbus — what was good, what wasn't,
      who liked it, and whether it's worth going back. <b>__COUNT__ places.</b>
      Her words, unedited.
    </p>
  </header>

  <div class="controls">
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search dishes, places, people — try “korma” or “Mom”" autocomplete="off" spellcheck="false" aria-label="Search the notes">
      <button class="btn" id="rand" title="Show me one at random">Surprise me</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <p class="count" id="count"></p>
  <main id="results"></main>

  <footer>
    Notes by C., kept since 2021. Site by James.
    <a href="https://github.com/mrjamesreeves">Source</a>.
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  'use strict';
  var ENTRIES = JSON.parse(document.getElementById('data').textContent);

  var VERDICT_ORDER = { great: 0, good: 1, ok: 2, meh: 3, bad: 4 };

  // Fold accents and punctuation so “Chuy’s” matches "chuys".
  function norm(s) {
    return (s || '').toLowerCase().normalize('NFKD')
      .replace(/[̀-ͯ]/g, '').replace(/[’']/g, '').replace(/\s+/g, ' ');
  }

  ENTRIES.forEach(function (e) {
    e._hay = norm([e.name, e.notes, e.location, e.cuisine.join(' '),
                   e.people.join(' '), e.people.indexOf('J') > -1 ? 'james' : '',
                   e.kind, e.verdict, e.visits.join(' ')].join(' \n '));
  });

  // --- filter state -------------------------------------------------------
  var state = { q: '', verdict: new Set(), cuisine: new Set(), people: new Set(), kind: new Set() };

  function counts(field) {
    var c = {};
    ENTRIES.forEach(function (e) {
      var vals = Array.isArray(e[field]) ? e[field] : (e[field] ? [e[field]] : []);
      vals.forEach(function (v) { c[v] = (c[v] || 0) + 1; });
    });
    return c;
  }

  var GROUPS = [
    { key: 'verdict', label: 'Verdict', order: function (a, b) { return VERDICT_ORDER[a] - VERDICT_ORDER[b]; } },
    { key: 'people',  label: 'With' },
    { key: 'cuisine', label: 'Food' },
    { key: 'kind',    label: 'Kind' },
  ];

  var filtersEl = document.getElementById('filters');
  GROUPS.forEach(function (g) {
    var c = counts(g.key);
    var keys = Object.keys(c);
    if (keys.length < 2) return;
    keys.sort(g.order || function (a, b) { return c[b] - c[a] || a.localeCompare(b); });

    var label = document.createElement('span');
    label.className = 'grouplabel';
    label.textContent = g.label;
    filtersEl.appendChild(label);

    keys.forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = esc(k === 'J' ? 'J' : k) + '<span class="n">' + c[k] + '</span>';
      b.addEventListener('click', function () {
        var on = state[g.key].has(k);
        if (on) state[g.key].delete(k); else state[g.key].add(k);
        b.setAttribute('aria-pressed', String(!on));
        render();
      });
      filtersEl.appendChild(b);
    });
  });

  // --- matching -----------------------------------------------------------
  function matches(e) {
    for (var i = 0; i < GROUPS.length; i++) {
      var key = GROUPS[i].key, sel = state[key];
      if (!sel.size) continue;
      var vals = Array.isArray(e[key]) ? e[key] : (e[key] ? [e[key]] : []);
      var any = false;
      sel.forEach(function (v) { if (vals.indexOf(v) > -1) any = true; });
      if (!any) return false;
    }
    if (!state.q) return true;
    // Every whitespace-separated term must appear somewhere. Quoted phrases
    // stay together, so "chicken korma" does not match korma alone.
    return terms(state.q).every(function (t) { return e._hay.indexOf(t) > -1; });
  }

  function terms(q) {
    var out = [], re = /"([^"]+)"|(\S+)/g, m;
    while ((m = re.exec(q))) out.push(norm(m[1] || m[2]));
    return out.filter(Boolean);
  }

  // --- rendering ----------------------------------------------------------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function linkify(html) {
    return html.replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      var clean = u.replace(/[).,]+$/, '');
      return '<a href="' + clean + '" rel="noopener">' + clean.replace(/^https?:\/\//, '') + '</a>';
    });
  }

  function highlight(html, ts) {
    if (!ts.length) return html;
    ts.forEach(function (t) {
      if (t.length < 2) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      // Skip anything inside a tag or entity so markup is not corrupted.
      html = html.replace(/(<[^>]*>)|([^<]+)/g, function (_, tag, text) {
        return tag || text.replace(re, '<mark>$1</mark>');
      });
    });
    return html;
  }

  function card(e, ts) {
    var d = document.createElement('article');
    d.className = 'card';
    d.id = e.id;

    var bits = [];
    if (e.verdict) bits.push('<span class="verdict v-' + e.verdict + '">' + e.verdict + '</span>');
    if (e.closed) bits.push('<span class="closed">Closed</span>');

    var meta = [];
    if (e.location) meta.push('<span class="where">' + esc(e.location) + '</span>');
    e.cuisine.forEach(function (c) { meta.push('<span class="tag">' + esc(c) + '</span>'); });
    if (e.kind === 'market') meta.push('<span class="tag">market</span>');
    e.people.forEach(function (p) { meta.push('<span class="tag person">with ' + esc(p) + '</span>'); });
    if (e.visits.length) meta.push('<span>' + esc(e.visits.join(' · ')) + '</span>');

    d.innerHTML =
      '<div class="cardhead"><h2 class="name"><a href="#' + esc(e.id) + '">' +
        highlight(esc(e.name), ts) + '</a></h2>' + bits.join('') + '</div>' +
      (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '') +
      '<div class="notes">' + highlight(linkify(esc(e.notes)), ts) + '</div>';

    // Long notes get clamped, but never while a search is highlighting inside
    // them — that would hide the thing the reader searched for.
    var notes = d.querySelector('.notes');
    if (!ts.length && e.notes.split('\n').length > 9) {
      notes.classList.add('clamped');
      var more = document.createElement('button');
      more.className = 'more';
      more.type = 'button';
      more.textContent = 'Read all of it';
      more.addEventListener('click', function () {
        notes.classList.remove('clamped');
        more.remove();
      });
      d.appendChild(more);
    }
    return d;
  }

  var resultsEl = document.getElementById('results');
  var countEl = document.getElementById('count');

  function render() {
    var ts = terms(state.q);
    var list = ENTRIES.filter(matches);

    countEl.innerHTML = '<b>' + list.length + '</b> ' +
      (list.length === 1 ? 'place' : 'places') +
      (list.length < ENTRIES.length ? ' of ' + ENTRIES.length : '');

    resultsEl.textContent = '';
    if (!list.length) {
      resultsEl.innerHTML = '<div class="empty"><b>Nothing here.</b>' +
        'C. has not eaten that, or has not written it down.</div>';
      syncURL();
      return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (e) { frag.appendChild(card(e, ts)); });
    resultsEl.appendChild(frag);
    syncURL();
  }

  // --- URL state, so a search can be shared -------------------------------
  function syncURL() {
    var p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    GROUPS.forEach(function (g) {
      if (state[g.key].size) p.set(g.key, [].concat.apply([], [Array.from(state[g.key])]).join(','));
    });
    var qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  function restore() {
    var p = new URLSearchParams(location.search);
    state.q = p.get('q') || '';
    document.getElementById('q').value = state.q;
    GROUPS.forEach(function (g) {
      (p.get(g.key) || '').split(',').filter(Boolean).forEach(function (v) { state[g.key].add(v); });
    });
    Array.prototype.forEach.call(filtersEl.querySelectorAll('.chip'), function (b) {
      var label = b.firstChild.textContent;
      GROUPS.forEach(function (g) { if (state[g.key].has(label)) b.setAttribute('aria-pressed', 'true'); });
    });
  }

  // --- wiring -------------------------------------------------------------
  var input = document.getElementById('q');
  input.addEventListener('input', function () { state.q = input.value.trim(); render(); });

  document.getElementById('rand').addEventListener('click', function () {
    var pool = ENTRIES.filter(matches);
    if (!pool.length) pool = ENTRIES;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    location.hash = pick.id;
    var el = document.getElementById(pick.id);
    if (el) el.scrollIntoView({ block: 'center' });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && document.activeElement !== input) { ev.preventDefault(); input.focus(); }
    if (ev.key === 'Escape' && document.activeElement === input) { input.value = ''; state.q = ''; render(); }
  });

  restore();
  render();

  if (location.hash) {
    var el = document.getElementById(location.hash.slice(1));
    if (el) el.scrollIntoView({ block: 'center' });
  }
})();
</script>

<script defer src="https://numbers.jamesreeves.co/numbers.js" data-site="food"></script>
