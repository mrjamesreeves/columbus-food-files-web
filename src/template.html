<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Columbus Food Files</title>
<meta name="description" content="C.’s raw notes on eating in Columbus: what’s good, what isn’t, and whether it’s worth going back.">
<meta name="theme-color" content="#faf9f9">
<meta property="og:title" content="Columbus Food Files">
<meta property="og:description" content="C.’s raw notes on eating in Columbus: what’s good, what isn’t, and whether it’s worth going back.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">

<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/nbb6llm.css">
<style>
  :root {
    --paper:#faf9f9; --card:#fff; --ink:#000; --soft:#666; --faint:#949494;
    --rule:#e3e0da; --accent:#EC0000; --chip:#8b8b8b; --chip-hover:#6b6b6b;
    /* Verdict colours, shared by the badges and the filter chips. */
    --v-great:#EC0000;
    --v-good:#FF7300;
    --v-ok:#748198;
    --v-meh:#798C82;
    --v-bad:#798C82;
    --serif:"playfair-display", Georgia, "Times New Roman", serif;
    --sans:"ibm-plex-sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#101010; --card:#191919; --ink:#fff; --soft:#9c9c9c; --faint:#6e6e6e;
      --rule:#2b2b2b; --accent:#ff3f2e; --chip:#4a4a4a; --chip-hover:#5e5e5e;
    }
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body { background:var(--paper); color:var(--ink); font-family:var(--sans);
         font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:880px; margin:0 auto; padding:0 20px; }

  header { padding:52px 0 24px; }
  h1 { font-family:var(--serif); font-weight:700; font-size:clamp(36px,7.5vw,58px);
       letter-spacing:-.015em; line-height:1.02; }
  h1 .dot { color:var(--accent); }
  .blurb { color:var(--soft); margin-top:14px; max-width:58ch; font-size:16px; }

  /* --- controls --- */
  .controls { background:var(--paper); padding:14px 0 12px;
              border-bottom:1px solid var(--rule); }
  .searchrow { display:flex; gap:8px; align-items:center; }
  #q { flex:1; min-width:0; font:inherit; font-size:16px; color:var(--ink);
       background:var(--card); border:1px solid var(--rule); border-radius:2px;
       padding:12px 14px; outline:none; }
  #q:focus { border-color:var(--accent); }
  #q::placeholder { color:var(--faint); }
  .btn { font:inherit; font-size:14px; color:var(--soft); background:var(--card);
         border:1px solid var(--rule); border-radius:2px; padding:12px 15px;
         cursor:pointer; white-space:nowrap; }
  .btn:hover { color:var(--ink); border-color:var(--ink); }

  .filters { display:grid; grid-template-columns:auto 1fr; gap:8px 14px;
             margin-top:12px; align-items:start; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    font: inherit;
    font-size: 10px;
    color: #fff;
    background: var(--chip);
    border: 1px solid var(--chip);
    border-radius: 2px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .chip:hover { background:var(--chip-hover); border-color:var(--chip-hover); }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent);
                               color:#fff; }
  /* Verdict chips wear their own colour. Text stays #fff across all of them
     for consistency — the badges keep their darker ink, where the contrast
     matters because they are always on screen rather than transient. */
  .cv-great:hover, .cv-great[aria-pressed="true"] { background:var(--v-great); border-color:var(--v-great); color:#fff; }
  .cv-good:hover,  .cv-good[aria-pressed="true"]  { background:var(--v-good);  border-color:var(--v-good);  color:#fff; }
  .cv-ok:hover,    .cv-ok[aria-pressed="true"]    { background:var(--v-ok);    border-color:var(--v-ok);    color:#fff; }
  .cv-meh:hover,   .cv-meh[aria-pressed="true"]   { background:var(--v-meh);   border-color:var(--v-meh);   color:#fff; }
  .cv-bad:hover,   .cv-bad[aria-pressed="true"]   { background:var(--v-bad);   border-color:var(--v-bad);   color:#fff; }
  .chip .n { opacity:.6; margin-left:6px; font-variant-numeric:tabular-nums; }
  .grouplabel {
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
    align-self: start;
    padding-top: 5px;
    margin-right: 3px;
    font-weight: 700;
  }

  .count { color:var(--soft); font-size:13px; letter-spacing:.02em; padding:18px 0 2px; }
  .count b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

  /* --- cards --- */
  main { padding-bottom:90px; }
  .card { background:var(--card); border:0; border-radius:16px;
          box-shadow:0 2px 3px 0 rgba(0, 0, 0, 0.10);
          padding:22px 24px; margin:14px 0; scroll-margin-top:24px; }
  .cardhead { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  .name { font-family:var(--serif); font-weight:700; font-size:32px;
          letter-spacing:-.01em; line-height:1.15; }
  .name a { color:inherit; text-decoration:none; }
  .name a:hover { color:var(--accent); }

  /* Playfair sits on a low baseline, so a baseline-aligned badge next to a
     32px title reads as sunken. Centring it on the title's line box fixes it
     without a magic offset, and still behaves if a long name wraps. */
  .verdict, .closed { align-self:center; }
  .verdict { font-size:10px; letter-spacing:.14em; text-transform:uppercase;
             font-weight:600; padding:4px 8px; border:0; border-radius:2px;
             line-height:1.4; color:#fff; }
  .v-great { background:var(--v-great); }
  .v-good  { background:var(--v-good); }
  .v-ok    { background:var(--v-ok); }
  .v-meh   { background:var(--v-meh); }
  .v-bad   { background:var(--v-bad); }
  .closed { font-size:10px; letter-spacing:.14em; text-transform:uppercase;
            font-weight:600; padding:4px 8px; border-radius:2px;
            background:#767676; color:#fff; line-height:1.4; }

  .meta { margin-top:7px; font-size:13px; color:var(--soft); }
  .meta .sep { color:var(--faint); padding:0 6px; }

  .notes { margin-top:15px; padding-top:15px; border-top:1px solid var(--rule);
           font-size:15px; color:var(--ink); overflow-wrap:anywhere; }
  .notes p { margin:0; }
  .notes .gap { height:.62em; }
  /* Apple Notes drops bold on paste, and what she bolds is almost always the
     section heading. Restoring the weight here recovers the structure. */
  .notes .nhead { font-weight:600; margin-top:.55em; }
  .notes ul { margin:.2em 0 .5em; padding-left:1.2em; }
  .notes li { margin:.12em 0; }
  .notes.clamped { max-height:11.5em; overflow:hidden;
                   -webkit-mask-image:linear-gradient(#000 62%, transparent);
                   mask-image:linear-gradient(#000 62%, transparent); }
  .more { margin-top:10px; font:inherit; font-size:13px; color:var(--accent);
          background:none; border:0; padding:0; cursor:pointer; }
  .more:hover { text-decoration:underline; }
  mark { background:var(--accent); color:#fff; border-radius:1px; padding:0 2px; }
  .notes a { color:var(--accent); }

  .empty { text-align:center; color:var(--soft); padding:70px 20px; }
  .empty b { display:block; font-family:var(--serif); font-weight:700;
             font-size:24px; color:var(--ink); margin-bottom:6px; }

  footer { border-top:1px solid var(--rule); padding:28px 0 64px;
           color:var(--faint); font-size:13px; }
  footer a.signin { color:var(--faint); text-decoration:none; border-bottom:1px dotted var(--rule); }
  footer a.signin:hover { color:var(--soft); }

  /* --- editing (only ever visible to C.) --- */
  .editbtn { font:inherit; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
             font-weight:600; padding:4px 8px; border:1px solid var(--rule); border-radius:2px;
             background:transparent; color:var(--soft); cursor:pointer; align-self:center; }
  .editbtn:hover { border-color:var(--ink); color:var(--ink); }
  .editor { width:100%; font:inherit; font-size:15px; line-height:1.55; color:var(--ink);
            background:var(--paper); border:1px solid var(--accent); border-radius:8px;
            padding:12px 13px; margin-top:15px; resize:none; overflow:hidden;
            -webkit-appearance:none; }
  .editor:focus { outline:none; box-shadow:0 0 0 3px rgba(236,0,0,.12); }

  /* Save controls live in the card, directly under the textarea. Nothing
     floats: floating bars fight the iOS keyboard and Safari's own bottom
     bar, and lose. */
  .editrow { display:flex; align-items:center; gap:12px; margin-top:10px; }
  .status { flex:1; font-size:13px; color:var(--soft); }
  .status.err { color:var(--accent); font-weight:600; }
  .editrow button { font:inherit; font-size:15px; font-weight:600; border-radius:8px;
                    padding:11px 22px; cursor:pointer; border:0; min-height:44px;
                    background:var(--accent); color:#fff; }

  .signin-wrap { max-width:340px; margin:60px auto; }
  .signin-wrap h2 { font-family:var(--serif); font-weight:700; font-size:26px; margin-bottom:6px; }
  .signin-wrap p { color:var(--soft); font-size:14px; margin-bottom:16px; }
  .signin-wrap input { width:100%; font:inherit; font-size:16px; padding:12px 14px;
                       border:1px solid var(--rule); border-radius:8px; background:var(--card);
                       color:var(--ink); margin-bottom:10px; }
  .signin-wrap button { width:100%; font:inherit; font-size:16px; font-weight:600;
                        padding:12px; border:0; border-radius:8px; min-height:48px;
                        background:var(--accent); color:#fff; cursor:pointer; }
  footer a { color:var(--soft); }

  @media (max-width:560px) {
    header { padding:34px 0 18px; }
    .card { padding:17px 18px; }
    .filters { grid-template-columns:1fr; gap:3px; }
    .grouplabel { padding-top:9px; }
    .filters > .grouplabel:first-child { padding-top:0; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Columbus Food Files<span class="dot">.</span></h1>
    <p class="blurb">
      C.’s raw notes on eating at __COUNT__ places in Columbus: what’s good,
      what isn’t, and whether it’s worth going back.
    </p>
  </header>

  <div class="controls">
    <div class="searchrow">
      <input id="q" type="search" placeholder="Search restaurants, cuisines, and dishes" autocomplete="off" spellcheck="false" aria-label="Search the notes">
      <button class="btn" id="rand" title="Show me one at random">Surprise me</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <p class="count" id="count"></p>
  <main id="results"></main>

  <footer>
    Notes by C., kept since 2021. Site by J.
    <a class="signin" id="signin" href="#signin">·</a>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  'use strict';
  var ENTRIES = JSON.parse(document.getElementById('data').textContent);

  var VERDICT_ORDER = { great: 0, good: 1, ok: 2, meh: 3, bad: 4 };
  var MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];

  // "2021-01-02" and "2023-12" both read as "January 2021" / "December 2023".
  // The exact day was never the useful part.
  function monthLabel(iso) {
    var p = iso.split('-');
    return MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function visitLabels(visits) {
    var out = [];
    visits.forEach(function (v) {
      var l = monthLabel(v);
      if (out.indexOf(l) === -1) out.push(l);
    });
    return out;
  }

  // Fold accents and punctuation so “Chuy’s” matches "chuys".
  function norm(s) {
    return (s || '').toLowerCase().normalize('NFKD')
      .replace(/[̀-ͯ]/g, '').replace(/[’']/g, '').replace(/\s+/g, ' ');
  }

  // People are no longer shown or filterable, but keeping them in the search
  // index means "mom" still finds the meals she was there for.
  ENTRIES.forEach(function (e) {
    e._hay = norm([e.name, e.notes, e.location, e.cuisine.join(' '),
                   e.people.join(' '), e.people.indexOf('J') > -1 ? 'james' : '',
                   e.kind, e.verdict, e.visits.join(' '),
                   visitLabels(e.visits).join(' ')].join(' \n '));
  });

  var state = { q: '', verdict: new Set(), cuisine: new Set(), kind: new Set() };

  function counts(field) {
    var c = {};
    ENTRIES.forEach(function (e) {
      var vals = Array.isArray(e[field]) ? e[field] : (e[field] ? [e[field]] : []);
      vals.forEach(function (v) { c[v] = (c[v] || 0) + 1; });
    });
    return c;
  }

  var GROUPS = [
    { key: 'verdict', label: 'Verdict', order: function (a, b) { return VERDICT_ORDER[a] - VERDICT_ORDER[b]; } },
    { key: 'cuisine', label: 'Food' },
    { key: 'kind',    label: 'Kind' },
  ];

  var filtersEl = document.getElementById('filters');
  GROUPS.forEach(function (g) {
    var c = counts(g.key);
    var keys = Object.keys(c);
    if (keys.length < 2) return;
    keys.sort(g.order || function (a, b) { return c[b] - c[a] || a.localeCompare(b); });

    var label = document.createElement('span');
    label.className = 'grouplabel';
    label.textContent = g.label;
    filtersEl.appendChild(label);

    var row = document.createElement('div');
    row.className = 'chips';
    filtersEl.appendChild(row);

    keys.forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.dataset.group = g.key;
      b.dataset.value = k;
      if (g.key === 'verdict') b.classList.add('cv-' + k);
      b.innerHTML = esc(k) + '<span class="n">' + c[k] + '</span>';
      b.addEventListener('click', function () {
        // One filter at a time: any click clears the rest, and clicking the
        // active chip turns it off.
        var wasOn = state[g.key].has(k);
        GROUPS.forEach(function (gg) { state[gg.key].clear(); });
        if (!wasOn) state[g.key].add(k);
        syncChips();
        render();
      });
      row.appendChild(b);
    });
  });

  function syncChips() {
    Array.prototype.forEach.call(filtersEl.querySelectorAll('.chip'), function (b) {
      b.setAttribute('aria-pressed', String(state[b.dataset.group].has(b.dataset.value)));
    });
  }

  function matches(e) {
    for (var i = 0; i < GROUPS.length; i++) {
      var key = GROUPS[i].key, sel = state[key];
      if (!sel.size) continue;
      var vals = Array.isArray(e[key]) ? e[key] : (e[key] ? [e[key]] : []);
      var any = false;
      sel.forEach(function (v) { if (vals.indexOf(v) > -1) any = true; });
      if (!any) return false;
    }
    if (!state.q) return true;
    return terms(state.q).every(function (t) { return e._hay.indexOf(t) > -1; });
  }

  function terms(q) {
    var out = [], re = /"([^"]+)"|(\S+)/g, m;
    while ((m = re.exec(q))) out.push(norm(m[1] || m[2]));
    return out.filter(Boolean);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function linkify(html) {
    return html.replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      var clean = u.replace(/[).,]+$/, '');
      return '<a href="' + clean + '" rel="noopener">' + clean.replace(/^https?:\/\//, '') + '</a>';
    });
  }

  function highlight(html, ts) {
    if (!ts.length) return html;
    ts.forEach(function (t) {
      if (t.length < 2) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      html = html.replace(/(<[^>]*>)|([^<]+)/g, function (_, tag, text) {
        return tag || text.replace(re, '<mark>$1</mark>');
      });
    });
    return html;
  }

  function titleCase(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  var BULLET = /^\s*[*\u2022\u00b7-]\s+(.*)$/;
  var NHEAD  = /^\s*(great|good|ok|okay|meh|bad|try|excellent|order|avoid)\s*:\s*$/i;

  // Her notes are line-based: bullet runs, the odd section heading, and plain
  // lines. Rendering those as real elements beats one pre-wrap blob.
  function renderNotes(text) {
    var out = [], list = null;
    function flush() {
      if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; }
    }
    text.split('\n').forEach(function (raw) {
      var line = raw.replace(/\s+$/, '');
      var b = line.match(BULLET);
      if (b && b[1].trim()) {
        (list = list || []).push('<li>' + esc(b[1]) + '</li>');
        return;
      }
      flush();
      if (!line.trim()) { out.push('<div class="gap"></div>'); return; }
      if (NHEAD.test(line)) { out.push('<p class="nhead">' + esc(line.trim()) + '</p>'); return; }
      out.push('<p>' + esc(line) + '</p>');
    });
    flush();
    return out.join('');
  }

  function card(e, ts) {
    var d = document.createElement('article');
    d.className = 'card';
    d.id = e.id;

    var bits = [];
    if (e.verdict) bits.push('<span class="verdict v-' + e.verdict + '">' + e.verdict + '</span>');
    if (e.closed) bits.push('<span class="closed">Closed</span>');

    // One bullet-separated line: "Indian • By Meijer • January 2021"
    var meta = e.cuisine.map(titleCase);
    if (e.kind === 'market') meta.push('Market');
    if (e.location) meta.push(e.location);
    visitLabels(e.visits).forEach(function (v) { meta.push(v); });

    d.innerHTML =
      '<div class="cardhead"><h2 class="name"><a href="#' + esc(e.id) + '">' +
        highlight(esc(e.name), ts) + '</a></h2>' + bits.join('') + '</div>' +
      (meta.length ? '<div class="meta">' +
        meta.map(esc).join('<span class="sep">•</span>') + '</div>' : '') +
      '<div class="notes">' + highlight(linkify(renderNotes(e.notes)), ts) + '</div>';

    if (IS_EDITOR) {
      var eb = document.createElement('button');
      eb.className = 'editbtn';
      eb.type = 'button';
      eb.textContent = 'Edit';
      eb.addEventListener('click', function () { openEditor(e, d); });
      d.querySelector('.cardhead').appendChild(eb);
    }

    var notes = d.querySelector('.notes');
    if (!ts.length && e.notes.split('\n').length > 9) {
      notes.classList.add('clamped');
      var more = document.createElement('button');
      more.className = 'more';
      more.type = 'button';
      more.textContent = 'Read all of it';
      more.addEventListener('click', function () {
        notes.classList.remove('clamped');
        more.remove();
      });
      d.appendChild(more);
    }
    return d;
  }

  var resultsEl = document.getElementById('results');
  var countEl = document.getElementById('count');

  function render() {
    var ts = terms(state.q);
    var list = ENTRIES.filter(matches);

    countEl.innerHTML = '<b>' + list.length + '</b> ' +
      (list.length === 1 ? 'place' : 'places') +
      (list.length < ENTRIES.length ? ' of ' + ENTRIES.length : '');

    resultsEl.textContent = '';
    if (!list.length) {
      resultsEl.innerHTML = '<div class="empty"><b>Nothing here.</b>' +
        'C. has not eaten that, or has not written it down.</div>';
      syncURL();
      return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (e) { frag.appendChild(card(e, ts)); });
    resultsEl.appendChild(frag);
    syncURL();
  }

  function syncURL() {
    var p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    GROUPS.forEach(function (g) {
      if (state[g.key].size) p.set(g.key, Array.from(state[g.key]).join(','));
    });
    var qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  function restore() {
    var p = new URLSearchParams(location.search);
    state.q = p.get('q') || '';
    document.getElementById('q').value = state.q;
    for (var i = 0; i < GROUPS.length; i++) {
      var g = GROUPS[i];
      var v = (p.get(g.key) || '').split(',').filter(Boolean)[0];
      if (v) { state[g.key].add(v); break; }
    }
    syncChips();
  }

  var input = document.getElementById('q');
  input.addEventListener('input', function () { state.q = input.value.trim(); render(); });

  document.getElementById('rand').addEventListener('click', function () {
    var pool = ENTRIES.filter(matches);
    if (!pool.length) pool = ENTRIES;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    location.hash = pick.id;
    var el = document.getElementById(pick.id);
    if (el) el.scrollIntoView({ block: 'center' });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && document.activeElement !== input) { ev.preventDefault(); input.focus(); }
    if (ev.key === 'Escape' && document.activeElement === input) { input.value = ''; state.q = ''; render(); }
  });

  // ---------------------------------------------------------------------
  // Editing. Everything below is inert unless C. is signed in; a visitor
  // never sees an edit affordance and never calls the API.
  // ---------------------------------------------------------------------
  var IS_EDITOR = /(?:^|;\s*)cff_editor=1(?:;|$)/.test(document.cookie);
  var editing = null;   // { id, card, textarea, original }
  var saveTimer = null;

  function status(text, isError) {
    if (!editing) return;
    editing.statusEl.textContent = text || '';
    editing.statusEl.className = 'status' + (isError ? ' err' : '');
  }

  function autosize(t) {
    t.style.height = 'auto';
    t.style.height = t.scrollHeight + 'px';
  }

  function openEditor(entry, cardEl) {
    if (editing && editing.id !== entry.id) closeEditor();
    var notes = cardEl.querySelector('.notes');
    var more = cardEl.querySelector('.more');
    if (more) more.remove();

    var t = document.createElement('textarea');
    t.className = 'editor';
    t.value = entry.notes;
    t.setAttribute('aria-label', 'Notes for ' + entry.name);
    notes.replaceWith(t);
    autosize(t);

    var row = document.createElement('div');
    row.className = 'editrow';
    var st = document.createElement('span');
    st.className = 'status';
    var done = document.createElement('button');
    done.type = 'button';
    done.textContent = 'Done';
    done.addEventListener('click', finish);
    row.appendChild(st);
    row.appendChild(done);
    t.after(row);

    editing = { id: entry.id, entry: entry, card: cardEl, textarea: t, statusEl: st, original: entry.notes };

    t.addEventListener('input', function () {
      autosize(t);
      status(t.value === editing.original ? 'Saved' : 'Unsaved');
      // A safety net, not the main path: if she locks her phone mid-thought
      // the edit is already on its way.
      clearTimeout(saveTimer);
      if (t.value !== editing.original) saveTimer = setTimeout(save, 2000);
    });
    t.focus();
    // iOS needs a beat before it will scroll a freshly focused field into view.
    setTimeout(function () { t.scrollIntoView({ block: 'nearest' }); }, 50);
  }

  function closeEditor() {
    clearTimeout(saveTimer);
    if (!editing) return;
    var e = editing;
    editing = null;
    // Re-render from the (possibly updated) entry so the card returns to normal.
    var fresh = card(e.entry, terms(state.q));
    e.card.replaceWith(fresh);
  }

  function save() {
    if (!editing) return;
    clearTimeout(saveTimer);
    var e = editing;
    var value = e.textarea.value;
    if (value === e.original) { status('Saved'); return; }
    e.original = value;   // claim it now so a second timer does not resend

    status('Saving…');
    fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: e.id, notes: value }),
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, body: j }; });
    }).then(function (out) {
      var live = editing && editing.id === e.id;
      if (!out.ok) {
        if (live) status(out.body.error || 'Could not save', true);
        else console.warn('save failed after close:', out.body.error);
        return;
      }
      // Reconcile whether or not the editor is still open. A save that lands
      // after she closes the card is still a save; the page must agree with
      // the server rather than quietly showing stale text until a reload.
      e.entry.notes = value;
      e.entry._hay = norm([e.entry.name, value, e.entry.location, e.entry.cuisine.join(' '),
                           e.entry.people.join(' '), e.entry.kind, e.entry.verdict].join(' \n '));
      e.original = value;
      if (live) { editing.original = value; status('Saved'); }
      // If the card has already closed and is back on the page, re-render it:
      // a save that lands after Done must still show up.
      if (!live) {
        var onPage = document.getElementById(e.id);
        if (onPage && !onPage.querySelector('.editor')) {
          onPage.replaceWith(card(e.entry, terms(state.q)));
        }
      }
    }).catch(function () {
      if (editing && editing.id === e.id) status('Offline — kept here, try again', true);
    });
  }

  function finish() {
    if (editing && editing.textarea.value !== editing.original) save();
    closeEditor();
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && editing) finish();
  });
  // Never lose an edit to a stray navigation.
  window.addEventListener('beforeunload', function (ev) {
    if (editing && editing.textarea.value !== editing.original) { ev.preventDefault(); ev.returnValue = ''; }
  });

  // --- sign in ----------------------------------------------------------
  function showSignIn() {
    resultsEl.innerHTML =
      '<div class="signin-wrap"><h2>Sign in</h2>' +
      '<p>For C. Everyone else can just read.</p>' +
      '<input type="password" id="pw" autocomplete="current-password" placeholder="Password">' +
      '<button type="button" id="pwgo">Sign in</button>' +
      '<p id="pwerr" style="margin-top:10px"></p></div>';
    countEl.textContent = '';
    var pw = document.getElementById('pw');
    var go = function () {
      document.getElementById('pwerr').textContent = 'Checking…';
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (out) {
          if (out.ok && out.body.editor) { location.hash = ''; location.reload(); }
          else document.getElementById('pwerr').textContent = out.body.error || 'Wrong password';
        })
        .catch(function () { document.getElementById('pwerr').textContent = 'Could not reach the server'; });
    };
    document.getElementById('pwgo').addEventListener('click', go);
    pw.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    pw.focus();
  }

  document.getElementById('signin').addEventListener('click', function (ev) {
    ev.preventDefault();
    showSignIn();
  });

  var wantSignIn = location.hash === '#signin' ||
                   new URLSearchParams(location.search).has('signin');
  restore();
  render();
  if (wantSignIn) showSignIn();
  window.addEventListener('hashchange', function () {
    if (location.hash === '#signin') showSignIn();
  });

  if (location.hash) {
    var el = document.getElementById(location.hash.slice(1));
    if (el) el.scrollIntoView({ block: 'center' });
  }
})();
</script>
