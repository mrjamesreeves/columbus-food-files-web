<style>
  :root {
    --paper:#faf9f9; --card:#fff; --ink:#000; --soft:#666; --faint:#949494;
    --rule:#e3e0da; --accent:#EC0000; --chip:#8b8b8b; --chip-hover:#6b6b6b;
    --serif:"playfair-display", Georgia, "Times New Roman", serif;
    --sans:"ibm-plex-sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#101010; --card:#191919; --ink:#fff; --soft:#9c9c9c; --faint:#6e6e6e;
      --rule:#2b2b2b; --accent:#ff3f2e; --chip:#4a4a4a; --chip-hover:#5e5e5e;
    }
    /* --ink is white in dark mode, so the "good" badge needs its own fill
       or it would be white text on white. */
    .v-good { background:#3d3d3d; }
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body { background:var(--paper); color:var(--ink); font-family:var(--sans);
         font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:880px; margin:0 auto; padding:0 20px; }

  header { padding:52px 0 24px; }
  h1 { font-family:var(--serif); font-weight:700; font-size:clamp(36px,7.5vw,58px);
       letter-spacing:-.015em; line-height:1.02; }
  h1 .dot { color:var(--accent); }
  .blurb { color:var(--soft); margin-top:14px; max-width:58ch; font-size:16px; }

  /* --- controls --- */
  .controls { position:sticky; top:0; z-index:20; background:var(--paper);
              padding:14px 0 12px; border-bottom:1px solid var(--rule); }
  .searchrow { display:flex; gap:8px; align-items:center; }
  #q { flex:1; min-width:0; font:inherit; font-size:16px; color:var(--ink);
       background:var(--card); border:1px solid var(--rule); border-radius:2px;
       padding:12px 14px; outline:none; }
  #q:focus { border-color:var(--accent); }
  #q::placeholder { color:var(--faint); }
  .btn { font:inherit; font-size:14px; color:var(--soft); background:var(--card);
         border:1px solid var(--rule); border-radius:2px; padding:12px 15px;
         cursor:pointer; white-space:nowrap; }
  .btn:hover { color:var(--ink); border-color:var(--ink); }

  .filters { display:grid; grid-template-columns:auto 1fr; gap:8px 14px;
             margin-top:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    font: inherit;
    font-size: 10px;
    color: #fff;
    background: var(--chip);
    border: 1px solid var(--chip);
    border-radius: 2px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .chip:hover { background:var(--chip-hover); border-color:var(--chip-hover); }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent);
                               color:#fff; }
  .chip .n { opacity:.6; margin-left:6px; font-variant-numeric:tabular-nums; }
  .grouplabel {
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
    align-self: start;
    padding-top: 5px;
    margin-right: 3px;
    font-weight: 700;
  }

  .count { color:var(--soft); font-size:13px; letter-spacing:.02em; padding:18px 0 2px; }
  .count b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

  /* --- cards --- */
  main { padding-bottom:90px; }
  .card { background:var(--card); border:0; border-radius:16px;
          box-shadow:0 2px 3px 0 rgba(0, 0, 0, 0.10);
          padding:22px 24px; margin:14px 0; scroll-margin-top:130px; }
  .cardhead { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  .name { font-family:var(--serif); font-weight:700; font-size:32px;
          letter-spacing:-.01em; line-height:1.15; }
  .name a { color:inherit; text-decoration:none; }
  .name a:hover { color:var(--accent); }

  /* Playfair sits on a low baseline, so a baseline-aligned badge next to a
     32px title reads as sunken. Centring it on the title's line box fixes it
     without a magic offset, and still behaves if a long name wraps. */
  .verdict, .closed { align-self:center; }
  .verdict { font-size:10px; letter-spacing:.14em; text-transform:uppercase;
             font-weight:600; padding:4px 8px; border:0; border-radius:2px;
             line-height:1.4; color:#fff; }
  /* Greys stay dark enough that white text on them stays legible at 10px. */
  .v-great { background:var(--accent); }
  .v-good  { background:var(--ink); }
  .v-ok    { background:#5a5a5a; }
  .v-meh, .v-bad { background:#767676; }
  .closed { font-size:10px; letter-spacing:.14em; text-transform:uppercase;
            font-weight:600; padding:4px 8px; border-radius:2px;
            background:#767676; color:#fff; line-height:1.4; }

  .meta { margin-top:7px; font-size:13px; color:var(--soft); }
  .meta .sep { color:var(--faint); padding:0 6px; }

  .notes { margin-top:15px; padding-top:15px; border-top:1px solid var(--rule);
           font-size:15px; color:var(--ink); white-space:pre-wrap;
           overflow-wrap:anywhere; }
  .notes.clamped { max-height:11.5em; overflow:hidden;
                   -webkit-mask-image:linear-gradient(#000 62%, transparent);
                   mask-image:linear-gradient(#000 62%, transparent); }
  .more { margin-top:10px; font:inherit; font-size:13px; color:var(--accent);
          background:none; border:0; padding:0; cursor:pointer; }
  .more:hover { text-decoration:underline; }
  mark { background:var(--accent); color:#fff; border-radius:1px; padding:0 2px; }
  .notes a { color:var(--accent); }

  .empty { text-align:center; color:var(--soft); padding:70px 20px; }
  .empty b { display:block; font-family:var(--serif); font-weight:700;
             font-size:24px; color:var(--ink); margin-bottom:6px; }

  footer { border-top:1px solid var(--rule); padding:28px 0 64px;
           color:var(--faint); font-size:13px; }
  footer a { color:var(--soft); }

  @media (max-width:560px) {
    header { padding:34px 0 18px; }
    .card { padding:17px 18px; }
    .grouplabel { display:none; }
  }
</style>
</head>

<script id="data" type="application/json">[{"id":"aab-india","name":"Aab India","kind":"restaurant","verdict":"great","closed":false,"location":"Grandview Ave","cuisine":["indian"],"people":[],"visits":[],"notes":"Grandview Ave\nlunch buffet! \nM-F 11:30-2:30 \nSa-Su 12-3\n17 min south of home \nGreat!\nNice inside. Lots of foods\nChicken tikka masala - great, creamy \nAlso had fried spicy meatball, fried pakora, spinach paneer, a few creamy veg dishes, garlic naan, watermelon, rice pudding.\n2nd time we went different things - great shrimp in shrimp curry\nCost $15 each for lunch \n$35 after tip"},{"id":"aangan-india-bistro","name":"Aangan India bistro","kind":"restaurant","verdict":"great","closed":false,"location":"5 min west of us across river","cuisine":["indian"],"people":["J"],"visits":["2023-12"],"notes":"5 min west of us across river\nGreat! In huge space w giant bar (used to be Mexican) and second floor diagrams, just opened Dec 2023\nPapari chat appetizer - Choley (chickpea curry), potatoes, pastry, cilantro and different spices. - interesting but too sweet \nFish pakora - good, small fried pieces of fish \nKadahi ginger chicken - spice level 2 - didn’t really taste ginger \nSaag paneer - good standard \nChicken korma - great \nGarlic naan - great \nVeg biryani - j said it’s fine \nLunch special $13 - for 3 small dishes, plentiful naan, basmati rice, sugar ball.\nVeg and non veg options only difference is one small dish \nMutter paneer really good flavor, red sauce\nPalak paneer good \nSome sour yellow curry meh \nNaan good (not spectacular) and generous portion, couldn’t finish \n$33 w tip for two"},{"id":"agni","name":"Agni","kind":"restaurant","verdict":"great","closed":false,"location":"Downtown on High Street","cuisine":[],"people":["J"],"visits":["2024-01-27"],"notes":"Multi-course meal by Bengali-American chef who is James Beard semifinalist and was on Top Chef\nDowntown on High Street \nTook J. for bday week 1/27/24\nGreat! They gave us bonus snacks, maybe three or four more extra appetizers and desserts than listed on menu\nParticularly loved the duck fat cinnamon butter, pistachio ice cream (I think they said it was not made w dairy?), \nSo many different chefs came to our table to introduce their dishes, very personal and friendly.\nTiny shot of soup when walking in - great, really deep flavor \nSourdough bread w duck fat cinnamon butter - that butter was so light and tasty and delicious \n1. FRENCH ONION CHAAT - Onsen Egg, Spinach, Piyaj Bhaji, Chutney, Heckuvagood Sauces - really good, tasty, nice hidden egg that yolked the whole crispy thing \n2. MOQUECA DE CAMAROES - Chingri Bhuna, Calabash, Pickle, Beresta\n3. 红油餃子 - Lamb Shoulder, Sichuan Kashmiri Oil, Embered Red Cabbage - just not that into lamb flavor, but otherwise great \n4. GOSHT JHOL - Malloreddus, Mushroom, Garnish - pasta dish, ok, nice al dente w pecorino \n5. DRY AGED ROHAN DUCK - Achiote, Mole, Duck Fat Arroz - discovered not that crazy about mole but now I know what it is, duck kind of chewy \n6. PISTACHIO - Orange, Saffron, Malt - pistachio ice cream tasted like butter, pretty amazing \nBuckey-shaped peanut butter morsel that encased tiny dollop of ice cream - great \n$125 each + sparkling water + two glasses wine that were like 15 each + 8 staff wellness fee + 20 tax = 310 + 70 tip = 380. Came away pretty stuffed but in a pleasant way. \nhttps://www.dineatagni.com/menu"},{"id":"al-manakeesh","name":"Al Manakeesh","kind":"restaurant","verdict":"ok","closed":false,"location":"by Meijer","cuisine":["middle eastern"],"people":["J"],"visits":[],"notes":"by Meijer. Cheeses and such on bread. Palestinian\nWait time is kinda long \n- two pizzas perfect amount to split between me and J \n- Zatar w tomato and cheese - ok, needed more sauce \n- Doblex meat cheese - like a sandwich in pizza form, Reuben without the Saurkraut \n- Meat cheese pizza - great, nice cinnamon flavor to meat \n- Akkawi cheese tomato pesto pizza - great, cheese like mozzarella \n- Labneh w zatar pizza - good, slightly sour yogurt w zattar mixed in (earthy) and arugula on top \nTry. \nMeat eggs pizza \nJerusalem bagel - turkey cheese or cheese pesto tomato rec \nLabneh (like greek yogurt) and vegetables pizza\nlabaneh and zaatar pizza too acidic said review"},{"id":"amul-india","name":"Amul India","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":["indian"],"people":["J"],"visits":[],"notes":"Good!\nLunch buffet every day $17 on weekdays \nLove the curry chicken - tender fall-off-bone. Last time it wasn’t bone-in chicken \nFor order:\nTry Kadahi Ginger Chicken - \nSaag paneer - great lop\nYellow Daal mild - good! Mellow. Only upon eating cold leftovers did I appreciate the flavor and it actually has a kick. \nPaneer makhani - tomato sauce - good, not as addictive as Clove’s version, where sauce reminds me of Spaghettios \nVeg biryani - J loves it, says it’s really spicy \nChicken korma - ok, more of an orange sauce and medium was dominated by spice \nSaag mushroom - good, w spinach \nEverything here at “medium” spice is a little too spicy for me, like mouth on fire and I don’t enjoy the flavor as much. \nLiked their motor paneer (orange sauce like Makhani) and chicken mahkani - rich and buttery except chicken super dry and didn’t want to eat it \nChicken tender in biryani and possibly other dishes \nHad chicken korma and nan \nNon pretty good, one regular and one w cheese that tasted the same \nJ had lamb korma \nAlso had a spinach palak paneer style thing w mushrooms, just so so\nStill looking for a better nan"},{"id":"awadh-indian-restaurant","name":"Awadh Indian restaurant","kind":"restaurant","verdict":"great","closed":false,"location":"Only 5 min away, near Walmart","cuisine":["indian"],"people":["J"],"visits":["2021-01-02","2021-01-25","2021-03-28","2021-12-23"],"notes":"Excellent! Had 1/2/21, 1/25/21, 3/28/21, 12/23/21 and 2022\nOnly 5 min away, near Walmart \nGreat: Chicken korma, spicy last time I had it when ordered from their site. See if it can be mild \nGood garlic naan, \nmalai kofta (similar to korma but tomato-based, hint of spaghetti-o flavor)\nBaigan ka bharta (eggplant): \nGood: Navaratan korma (vegetarian kind)\nOk: Mutter paneer (too spicy for me), \nDal Takani (yellow lentils, alright mellow flavor)\nJ had lamb korma, liked it\nCoconut peanut chili paneer - J liked it. Has creaminess like korma but w Indian cheese blocks and more ginger flavor and a kick"},{"id":"awadh-indo-chinese-restaurant","name":"Awadh Indo-Chinese restaurant","kind":"restaurant","verdict":"great","closed":true,"location":"By Meijer","cuisine":["chinese"],"people":["J","Mom"],"visits":[],"notes":"Closed i think \nBy Meijer \nManchurian Fish - great! Ginger garlic sauce really good, reminds me of mom’s fish from back in day, chinese flavor \nMixed Hakka Noodles - good! Thin noodles w egg and meats like Mei fen but without curry flavor \nHot Garlic Shrimp - alright, red sauce\nSzechuan Chicken - alright, red sauce \nChicken appetizer (signature dish) - alright\nJ got Szechuan lamb noodles and really liked it, generous portion, said it was spicy \nTry:\nChili Chicken Gravy - Our most popular dish is sautéed with fresh cilantro, chili and onions.\nSzechwan Vegetables \nSalt + Pepper Dry Fish\nShrimp Manchurian Gravy"},{"id":"bamboo-thai-kitchen","name":"Bamboo Thai Kitchen","kind":"restaurant","verdict":"great","closed":false,"location":"by Ming Ga, take-out only","cuisine":["thai"],"people":["J"],"visits":[],"notes":"(by Ming Ga, take-out only)\nJ said Siam Orchid better. Curries here too watery. \nBangkok noodles, medium spice - really good! Like pad see ew but not sweet and has nice kick. I ate his leftover bean sprouts and cabbage mix from this, it was good flavor of ginger and spice. \nFried chicken appetizer - great! 5 pieces and looks more like roasted, good flavor. Ate them all in one sitting. \nHouse Fried rice, medium spice - j thinks it’s great, spicy \nChicken satay - ok, dry chicken \nTom kha soup medium spice - ok, on sour side \nPad Kra pow w beef medium spice - good! a little spicier than I usually like, but good flavor, good beef. Next time try mild. \nLarb w chicken - really tasty. Last time I got it, a little too sweet, not as into\nGreen curry chicken - good but even mild on the too spicy end for me."},{"id":"bawarchi-biryani","name":"Bawarchi Biryani","kind":"restaurant","verdict":null,"closed":false,"location":"In stripmall on sawmill just north of Sawmill","cuisine":["indian"],"people":["J"],"visits":[],"notes":"In stripmall on sawmill just north of Sawmill \nTakeout kind of place\nJ got chicken Hyderabadi biryani and naan, I think he didn’t like it"},{"id":"belle-bakery","name":"Belle bakery","kind":"restaurant","verdict":"great","closed":false,"location":"In Asian complex","cuisine":["bakery"],"people":[],"visits":[],"notes":"In Asian complex \nGreat Tirimisu cake \nCheese dome \nMango mousse slice \nStrawberry cake meh \nSingle wrapped bread w custard good - like reverse Danish \nBelles bakery (same strip mall as Ichiban, lots of Asian things here) - great strawberry shortcake and Tirimisu"},{"id":"bibibop","name":"Bibibop","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":[],"people":[],"visits":[],"notes":"Great! Good salad, lots of toppings"},{"id":"blue-ginger","name":"Blue ginger","kind":"restaurant","verdict":"meh","closed":false,"location":"on sawmill (Chinese + sushi)","cuisine":["chinese","japanese"],"people":[],"visits":[],"notes":"on sawmill (Chinese + sushi)\nGot 2 roll sushi lunch, meh\nBut nice big booths and mood lighting \nTry Chinese lunch special next time"},{"id":"bonefish","name":"Bonefish","kind":"restaurant","verdict":"meh","closed":false,"location":null,"cuisine":["seafood"],"people":["Mom","Dad"],"visits":["2022-06-04"],"notes":"6/4/22 went w Mom and Dad. Meh. Expensive and not flavorful enough. Portions small. And waiter rude, made a fuss when Mom tipped 18%."},{"id":"bonsai","name":"Bonsai","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":["japanese","korean"],"people":["J","Mom","Dad"],"visits":["2023-06"],"notes":"Korean and Japanese. Went w mom dad June 2023. Nice decor and soft music, in strip mall south. Good salmon teriyaki, shrimp veg tempura. Dad got jap chae liked it. Mom J got spicy tuna said it was meh. Cat food kind."},{"id":"borgata","name":"Borgata","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":["italian"],"people":["J"],"visits":[],"notes":"Pizza\nGot supreme to go \nGood, tons of toppings, pepperoni and sausage have a kick. Thicker bread than I usually like. J liked it. Similar to Luna pizza that Marty ordered in that one time"},{"id":"brown-bag-deli","name":"Brown bag deli","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":["american"],"people":["J"],"visits":[],"notes":"when we had picnic in downtown Columbus in Schiller park, geese\nGot Village Addiction - turkey w melted cheese and cranberry sauce on sourdough. Good! J got whatever equilvqlwnt he gets at jimmy johns, Italian, 1/2 size was so small, said it was ok. I gave him 1/2 mine."},{"id":"bubbakoos-burritos","name":"Bubbakoo’s Burritos","kind":"restaurant","verdict":"great","closed":false,"location":"In strip in front of Target on Sawmill","cuisine":["japanese","mexican"],"people":["J"],"visits":[],"notes":"(In strip in front of Target on Sawmill)\nGreat but small portions - Got burrito bowl w hibachi shrimp, brown rice,\nbeans, tomato salsa, corn, red onions, cilantro, lettuce w regular salsa sauce on side. ($12) custom fast food style like Bibibop. Salsa good flavor, glad only in one corner. Added Greek yogurt at home. Shrimp small but tender (cooked on demand) and good flavor. \nJ got spicy pork burrito and liked it.\nQuesadilla chicken - ok, good char and size, just not into charred chicken flavor, too something"},{"id":"buckeye-pho","name":"Buckeye Pho" umplings, not impressed, said he wouldn’t do this place again"},{"id":"katzingers-delicatessen","name":"Katzinger’s Delicatessen","kind":"restaurant","verdict":"ok","closed":false,"location":"One in Dublin has parking lot, indoor seating","cuisine":[],"people":[],"visits":[],"notes":"Tons of made to order sandwiches \nTuna sandwich on rye - no celery or crunch, kind of bland\nChopped liver 10.50/lb - ok\nOne in Columbus on a dingy corner, only street parking, has a little outdoor seating \nOne in Dublin has parking lot, indoor seating"},{"id":"kitchen-social","name":"Kitchen Social","kind":"restaurant","verdict":"ok","closed":false,"location":"Downtown Dublin","cuisine":[],"people":["J","Mom"],"visits":[],"notes":"Menu: https://ks2022.k2dweb.com/wp-content/uploads/2022/09/KitchenSocial_Dinner_menu_BP_010722.pdf\nDowntown Dublin \nCheddar scallion biscuits - delicious! Soft w crisp outer bits, buttery, yum \nThai shrimp - ok, fried shrimp w raw salad-like veg \nEggplant meatballs - good! Soft, sauce is good, slightly smoky tomato based \nBlackened shrimp capellini - great! Mom loves it. Tomato based spaghetti dish w a slight spice \nSalmon salad (salmon medium cooked) - good, salmon tender but no flavored, salad has small bits of sweet potato, quinoa, slightly sweet dressing \nSalmon entree (medium cooked) - good, salmon has slightly crisp outside (fried?) and tender inside. No flavor. Farro and spinach. Might like salad version more, although that dressing was maybe too sweet \nMushroom pizza - ok, too doughy for me \nFish and chips - good, fish is lightly crispy, but I just not that into fried food, fries soggy, coleslaw a little too sour \nCrab crusted snapper - meh, not enough flavor \nMiso butter cod - ok good, flaky, more like cod w crusty flavor on top. Rice medley it’s on is meh \nJ got chicken sandwich. Liked it. \nOpen airy space, sat by open side w fan \nhttps://www.yelp.com/biz/kitchen-social-dublin?osq=kitchen+social\nhttps://ks2022.k2dweb.com/wp-content/uploads/2022/09/KitchenSocial_Dinner_menu_BP_010722.pdf"},{"id":"koshi","name":"Koshi","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":["japanese","korean"],"people":[],"visits":[],"notes":"Korean/sushi inside Saraga Grocery\nmaybe 5 or so tables, order at register. Served 3 small bancha, kimchi radish, potato, and good egg w green onion. They don’t serve free water.\nHot stone bibimbap w bulgogi - great! Nice crispy rice when smush it to the side. Used leftover soy sauce from dumpling as sauce. \nMandu dumplings - good \nKimbap w bulgogi \nEgg rolls - someone said the best \nJap chae \nhttps://www.koshiohio.com/menus\nhttps://www.yelp.com/biz/koshi-korean-food-and-sushi-columbus-2?start=30"},{"id":"kung-fu-noodle","name":"Kung Fu Noodle","kind":"restaurant","verdict":"good","closed":false,"location":"Pulled noodles on Bethel","cuisine":["vietnamese"],"people":["J"],"visits":[],"notes":"Pulled noodles on Bethel \nBraised beef noodle soup - good, tender beef. Includes soft small carrots, cilantro, and green onion.  Like that for takeout, they separate noodles from soup, so I can add smaller amount of noodles. Broth good, kind of on salty side and not as 3-dimensional as pho (no anise flavor) \nJ liked their fried rice \nhttps://www.clover.com/online-ordering/kung-fu-noodle-columbus-columbus-2"},{"id":"kyoto","name":"Kyoto","kind":"restaurant","verdict":"ok","closed":false,"location":"on Sawmill","cuisine":["seafood"],"people":[],"visits":[],"notes":"on Sawmill\nNice decor and Food fine but service really slow \nSpicy kani salad (crab salad) - ok, not much crab \nSquid salad - ok, just like tensuke, sometimes tougher \nBeef negimaki - ok\nShrimp tempura - fine \nSalmon avocado roll - typical, not much rice so that’s good \nEel avocado roll - typical"},{"id":"lalibela","name":"Lalibela","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":["ethiopian"],"people":[],"visits":["2022-04-03"],"notes":"Ethiopian\nGreat! Ate 4/3/22\nVeggie combo w beef\nReally large, ate half and took rest home\nRestaurant bit dingy\nNext time try shiro\nMahberoch = meat and veggie combo\nBeyaynetu  = veggie only combo\nPeople also love shiro (chickpea stew)"},{"id":"lindeys","name":"Lindey’s","kind":"restaurant","verdict":"great","closed":false,"location":"In German part of downtown","cuisine":[],"people":["J","Mom","Dad"],"visits":["2022-06-10"],"notes":"Old school fancy restaurant w great patio. Ok, good service, full of blue bloods making deals\nIn German part of downtown. Free valet. Patio is first come first served (already full when we arrived at 11:45)\n6/10/22 Went w Mom Dad. \nFree bread basket - crispy cheesy seed flat bread great, sourdough ok\nSalmon $17 very good, tender, nearly raw in middle, although salad around it was weird giant leaves\nLobster bisque just ok, creamy w little/no lobster\nJ said spicy crispy chicken sandwich $15 was just ok\nMom liked angel hair pasta w shrimp $20, good flavor but they didn’t give many shrimp."},{"id":"local-cantina","name":"Local cantina","kind":"restaurant","verdict":"great","closed":false,"location":"Downtown Dublin, outdoor seating","cuisine":["mexican"],"people":["J","Mom","Dad"],"visits":["2022-08-16"],"notes":"Downtown Dublin, outdoor seating \nTaco Tuesdays - tacos each $2.22\n8/16/22 Went w Corinna \nCantina Fish (fried fish taco) - excellent! Mom and dad’s favorite, as good as Texas they said, light crispy \nCalifornia chicken - pretty good, slice of avocado\nPhooey - meh, too sweet \nGrilled fish - meh, no flavor\nSpicy Tonga chicken - too spicy for me \nShrimp tempura - good, pretty fried \nBan mi - good, pork dry big chunk \nGrilled shrimp - ok, sour\nCorinna tried steak one and didn’t like it \nQuesadilla good, light crisp tortilla w cheese and chicken, little pile sour cream, lettuce, tomatoes \nJ not impressed w small tacos \nFree Serve yourself chips and salsa"},{"id":"longhorn","name":"Longhorn","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":["seafood"],"people":["J","Mom","Dad"],"visits":[],"notes":"Bread for table - nice butter, mom liked \nSeafood chowder - good, mom dad liked, well seasoned, not too salty \nCaesar salad - generous size, fresh but too much dressing \nSurf n turf - great, medium rare filet was tender (maybe too soft or rare), lobster tail was tender not overcooked. Asparagus generous portion, good but a bit too salty \nBaby back ribs - mom liked, tender but sauce too sweet \nDad got salad w steak on it, ranch dressing, liked it \nCrispy chicken sandwich - to go for James, he liked it, would order again"},{"id":"los-guachos-taqueria","name":"Los Guachos Taqueria","kind":"restaurant","verdict":"great","closed":false,"location":"Godown Rd","cuisine":["mexican"],"people":[],"visits":[],"notes":"Godown Rd\nAl Pastor taco - great! Small but pork good flavor like Asian red pork \nFish grilled taco - good size, fresh \nFish fried taco - good size, fresh"},{"id":"main-moon","name":"Main Moon","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":["chinese"],"people":["J"],"visits":[],"notes":"Szechuan\nGood:\nCashew chicken - great! Good flavor brown sauce, not fried, chicken w zucchini, not too salty either \nBeef mushroom stir fry - great! Good flavor brown sauce \nStir fry noodle - good, same as Dan Dan noodles\nDumplings on chili oil - good \nSzechuan fish - great! Soft filets in lots of sauce (ginger, garlic, red)\nOk:\nHunan combo - shrimp, chicken, beef w veg (chef’s rec) - good, brown sauce, but too salty \nOcean Delight - seafood combo (chef’s rec) - good, healthy, not much flavor, clear sauce, lots of veg \nSlippery fish filet - ok, no flavor, nice soft filets w thick veg \nLake tong ting prawn - ok, no flavor, shrimp w big veg, j hated white squce \nCelery beef shank cold dish - too salty \nPrawn with black bean sauce - good, bit too salty. Shrimp are unshelled, little salty black beans in it, chunky peppers \nBoiled fish filet in hot chili oil - ok \nTry:\nShredded Pork with Bamboo Shoots and Bean curd\nbraised beef stew w bamboo shoots - \nSpicy eggplant in garlic - \nHunan Chicken (banners of chicken w broccoli, looks good)\nShredded pork w bamboo shoots and bean curd \nEggplant in garlic sauce \nCumin beef - meh. No cilantro, too salty and flavored \nChong Qing chicken (more peppers than chicken like Chuan Jian hao zi) \nHunan Chicken (banners of chicken w broccoli, looks good, basic)\nChicken corn soup \nMapo tofu \nSalt and pepper tofu (fried cubes)"},{"id":"masseys-pizza","name":"Massey’s pizza","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":["italian"],"people":["J"],"visits":[],"notes":"Thin crust corn meal, j loves after we had it at Marty’s\nSupreme - great! Generous toppings \nPhilly - meh, no flavor \nBLT - intriguing \nVeggie - don’t like sour banana peppers"},{"id":"matt-the-miller","name":"Matt the Miller","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":[],"people":[],"visits":[],"notes":"Place Corinna and Jeff seem to like\nGood ahi tuna flatbread \nGood ribs"},{"id":"meshikou","name":"Meshikou","kind":"restaurant","verdict":null,"closed":false,"location":"Ramen place on Bethel Rd","cuisine":["japanese"],"people":["J"],"visits":["2022-01-14"],"notes":"Ramen place on Bethel Rd\nOrdered take out 1/14/22\nShoyu Paitan Ramen w pork tenderloin - Delicious! Soup base is thick and very flavorful, like condensed chicken stock. Noodles thinner than usual and hold soup flavor. Ate off of it for several days, when soup base congeals onto noodles.\nJames got spicy miso ramen and liked it."},{"id":"ming-ga","name":"Ming Ga","kind":"restaurant","verdict":"great","closed":false,"location":"Korean restaurant in strip mall bw condo and Antrim Park","cuisine":["korean"],"people":["J"],"visits":["2021-04-11","2022-08-09"],"notes":"Korean restaurant in strip mall bw condo and Antrim Park\nJ loves kimchi fried rice \nGood lunch special - ate in 8/9/22, popular, slow service \nKalbi Beef ribs box, great flavor, bone in and cut other way.\nJ got Pork bulgogi box, liked it \nSoon tofu w seafood lunch special - meh\nOrdered 4/11/21\nJap chae - great! Good amount veggies and meat too \nPork bulgogi - great flavor; some fatty meats \nSeafood pancake - very oily on an egg pancake \nKimchi dumplings - meh, tasted like play do \nCame w whole styrofoam container of vegggir side dishes: Kim chi, spicy daikon radish, spicy cucumber, greens similar to blanched spinach, bean sprouts, curry potatos and carrots\nGrilled Mackerel Kui/Gui - ok, pretty fishy, bones"},{"id":"momo-ghar","name":"Momo Ghar","kind":"restaurant","verdict":null,"closed":false,"location":"Nepalese dumplings in north market downtown.","cuisine":[],"people":["J"],"visits":[],"notes":"Nepalese dumplings in north market downtown. \n“Not going back. Glad I went.” - James\nTried combo chicken ones (special flavor like ginger curry) and pork ones (tastes just like regular dumplings). Skins are thick, watery sauce is spicy."},{"id":"mr-sushi","name":"Mr Sushi","kind":"restaurant","verdict":"good","closed":false,"location":"by library","cuisine":["japanese"],"people":[],"visits":[],"notes":"by library\nLunch box special expensive and not really sushi focused (very little spicy salmon in roll w too much rice). Beef bulgogi did have good flavor."},{"id":"ne-chinese-restaurant","name":"NE Chinese restaurant","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":["chinese"],"people":["Mom","Dad"],"visits":["2022-06-05"],"notes":"Excellent! Hole in wall on High St w sticky floor but really good, highest reviewed Chinese in Columbus \nGreat: \nSpicy twice cooked fish - excellent! Fluffy fried outer crust and super soft fish. Five spice flavor with a little kick. \nMixed vegetables salad - excellent! Thinly sliced w tangy cilantro fresh dressing\nEggplant - great, classic soft\nChicken w soy sauce - good, sauce-y, classic w blocky celery + carrots\nOk: \nSpicy pork w cilantro - ok, sour flavor so not as into\nPeople also love cumin potatoes \n6/5/22 - went w Mom and Dad \nSalt and pepper shrimp - also good, lightly fried, good flavor\nBraised beef appetizer - ok, the sliced cold kind, kind of beef jerky tasting"},{"id":"neehee-indian","name":"Neehee Indian","kind":"restaurant","verdict":"good","closed":false,"location":"Street food indian w crunchy bits and crispy puffs","cuisine":["indian"],"people":["J"],"visits":[],"notes":"Street food indian w crunchy bits and crispy puffs. Dosas come w good potato mash, watery curry, and two pretty good dips - cilantro and something else. \nPretty good, some too spicy for me\nCheese and chili dosa without chili - almost no filling. Meh.\nDosa w cottage cheese good but a little spicer than I usually like \nMini Thali too spicy too, didn’t like\nSpecial Bhel Puri (puffed rice mixed with sweet and tangy tamarind chutney, spicy cilantro-mint chutney, garlic chutney sev (fried gram flour vermicelli), black chickpea and chopped onions, potato, tomato, and cilantro.)- good\nPav Bhaji - good but has a kick, burger buns weird \nDahi samosa chaat \nGood Ice creams:\nFennel (nice cake-like bits too)\nGinger \nMava elaichi (green cardamom) great \nKesar pista (saffron and pistachio) pretty good \nTaste test of kesar pista - not much flavor \nDahi samosa Chat -\nPani Puri (puffed pastries fill w potato mix) - ok \nVeg Hakka noodles - standard lo mein \nJames likes Sandwich Masala Dosa Wrap"},{"id":"noodles-company","name":"Noodles & company","kind":"restaurant","verdict":null,"closed":false,"location":"High st after Antrim","cuisine":[],"people":[],"visits":[],"notes":"on map\nOr  (name on storefront) \nOr noodle world company \nBw home and tensuke \nCauliflower gnocchi in roasted garlic sauce - good, gnocchi impressive, but sauce kind of salty \nHigh st after Antrim\nAsian apple citrus salad - good! Fresh ingredients, cut it up to smaller sizes. e - James liked but really rich, took half home\nChocolate torte - super rich like straight up chocolate, mom took most home \nWorth it for lobster and scallops"},{"id":"oscars","name":"Oscars","kind":"restaurant","verdict":"great","closed":false,"location":"Directly across from Library in Dublin","cuisine":[],"people":["J","Mom"],"visits":[],"notes":"Directly across from Library in Dublin\nLovely outdoor seating under real grape plant trellis\nWalleye - great! Good flavor sauce, gratin great, cauliflower onion medley good\nMom got baby back ribs - delicious, generous portion, fall-off-bone soft \nVegan eggplant parmesan - ok, good basil flavor at moments but eggplant oily \nJ had baby back ribs sandwich, said ok, sweet"},{"id":"paris-banh-me","name":"Paris banh me","kind":"restaurant","verdict":"great","closed":false,"location":"by FedEx on sawmill","cuisine":["vietnamese"],"people":["J","Mom","Dad"],"visits":[],"notes":"by FedEx on sawmill\nBan mi w grilled beef - great! Good flavor meat, also w cilantro carrot the usual \nR3 - Beef stew - bo kho - w bread - Great! Like that I can order bread so there are no carbs in the soup. Beef is tender \nN1 - Vermicelli combo w beef - great, Mom got, tasted the meat and it was great flavor \nDad got shrimp pho and liked it \nJ got tofu Bahn mi and liked it - veg nice flavor \nTry:\nR2 - Beef brisket and steak pho \nB3 Grilled Pork Banh mi - thit nuong \nMeh:\nEgg rolls - meh, small \nCrab rangoon - ok\nFried dumpling - meh, small and very fried \nR1 - Spicy Lemongrass noodle - bun bo hue - too much fish sauce and oil. Not that into flat strip meats."},{"id":"the-pearl","name":"The Pearl","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":[],"people":[],"visits":[],"notes":"Loud obnoxious music makes price not worth it \nCornbread - good, one thing can serve at least 4 people \nGarlic shrimp - good, not overcooked, nothing special \nTater tots - good, soft inside \nBraised short rib - really tender and delicious, mashed potatoes good, other veg sticks that comes with it is strangely too firm"},{"id":"pho-chef","name":"Pho Chef","kind":"restaurant","verdict":"good","closed":false,"location":"near Whole Foods","cuisine":["vietnamese"],"people":["J"],"visits":[],"notes":"near Whole Foods\nShrimp rice noodle soup - good, very light broth, had to add a little soy (available on table w all condiments), small but soft shrimp, generous basil and sprouts.\nJ got beef pepper w rice - ok, not spicy at all.\nV12 sautéed black pepper beef vermicelli - ok, white plain noodles so had to add tempura and sesame oil \nN3 curry chicken flat noodles - good! Egg noodles and egg bits \nB1 grilled pork banh mi sandwich - ok, good flow or pork but skimpy on filling"},{"id":"piada-italian-street-food","name":"Piada Italian street food","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":["italian"],"people":[],"visits":["2023-12"],"notes":"avocado chop salad w steak - good, small size enough, still had leftovers \nGarlic Dough - meh in Dec 2023 return, tasted like nothing. Before, great! Thin triangle w garlic flavor between. Like cross between naan and roti \nSuper Protein Bowl w beef - ok, not much flavor, little pesto, but def healthy. Dipped beef in chicken korma.\nPesto Noodles w meatballs, good \nFarmers market salad with chicken - First time good - small is a generous size. Avocado, strawberry, corn, cabbage, candied pecans, spring greens in a refreshing lemon-y dressing. Second time underwhelming, not enough dressing\nLobster bisque - just ok, very buttery \nAvocado Piada ok - like a burrito w greens, avocado, bacon, ranch-like dressing"},{"id":"pokebap","name":"Pokebap","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":[],"people":["J"],"visits":["2021-02-17","2022-01-19"],"notes":"Had 2/17/21, 1/19/22\nMake your own poke bowl\nSalad base, 2 scoops salmon, extra scoop of spam, veggie toppings, wasabi aioli - Great! The best poke bowl I’ve had. Good sauce, fresh salmon (not much though) and spam was tasty. Ate the whole thing in one sitting. Cut the salad and carrots into smaller bits before eating. Also prepared 1/2 home avocado w wasabi tempura sauce and combined w salmon. $15\nJames had valcano bowl or something like that, said it wasn’t worth $15. Said to write that down in my notes :)\n2/17/21 - I had salad base, 2 scoops salmon, lots of veggie toppings, ponzu sauce - alright"},{"id":"preston-eatery","name":"Preston eatery","kind":"restaurant","verdict":null,"closed":false,"location":"In strip mall on Bethel Rd bw park and home","cuisine":[],"people":[],"visits":[],"notes":"In strip mall on Bethel Rd bw park and home \nGrab and go full meals, also salads prepared to order \nHoney mustard chicken Cobb salad \nChicken salad \nCarrot cake"},{"id":"the-rail","name":"The Rail","kind":"restaurant","verdict":null,"closed":false,"location":null,"cuisine":["american"],"people":[],"visits":[],"notes":"Local Burger shake place \nBrunch w Corinna and Jeff before car shopping"},{"id":"rebol","name":"Rebol","kind":"restaurant","verdict":null,"closed":false,"location":null,"cuisine":[],"people":[],"visits":[],"notes":"Hip place in the new city area just north of us\nNice healthy bowls like bibibop but w tuna \nHad cauliflower rice, tuna, pickled veggies"},{"id":"red-lobster","name":"Red Lobster","kind":"restaurant","verdict":"ok","closed":false,"location":null,"cuisine":["seafood"],"people":[],"visits":[],"notes":"Booths, mood lighting, free delicious cheddar biscuits, easily pay at the table on a screen whenever you’re ready \n$16 Garlic shrimp skewers w side of coleslaw and Caesar salad \nColeslaw just ok, shrimp a little overcooked"},{"id":"revelry-tavern","name":"Revelry tavern","kind":"restaurant","verdict":"good","closed":false,"location":"Near AMC movie theater","cuisine":[],"people":["Mom","Dad"],"visits":[],"notes":"(Near AMC movie theater)\nTry: Short rib grilled cheese \nThai lettuce wrap - good, fresh tasting, ginger sauce too sweet so use sparingly\nQuesadilla w chicken - good, standard \nBrussel sprouts salad w shrimp - ok, shrimp tiny \nMom had short rib tacos and liked them \nDad had shrimp tacos and liked them \nhttps://revelrytavern.com/dublin-revelry-tavern-food-menu\nhttps://www.yelp.com/biz/revelry-tavern-dublin"},{"id":"saraga-international-grocery","name":"Saraga International Grocery","kind":"market","verdict":"great","closed":false,"location":"18 min by highway","cuisine":["indian","korean"],"people":[],"visits":["2022-05-26"],"notes":"Amazing! Huge and kind of feels like another country, tiny restaurants jewelers in spaces along the perimeter, including tiny Korean place filled w Asians. Went 5/26/22 in search of Momo Ghar but couldn’t find it. Whole aisles dedicated to just Southeast Asia or India. Lots of fresh produce I’ve never seen before. \n18 min by highway"},{"id":"sesame-sea-asian-bistro","name":"Sesame Sea Asian Bistro","kind":"restaurant","verdict":"good","closed":false,"location":"In strip w Katzingers Dublin","cuisine":[],"people":["J"],"visits":[],"notes":"In strip w Katzingers Dublin\nLunch special good deal - 10.50-11 for soup + lunch portion entree\nGinger shrimp - bad, red sweet and sour sauce w undercooked broccoli. J had coconut curry, liked it"},{"id":"siam-orchid-thai","name":"Siam Orchid Thai","kind":"restaurant","verdict":"meh","closed":false,"location":"Sawmill rd, north of highway","cuisine":["thai"],"people":["J","Dad"],"visits":[],"notes":"Sawmill rd, north of highway\nTry:\n- Almond Ding - Sauteed diced broccoli, water chestnuts, bamboo shoots, snow pea pods, mushroom, and almond nuts in a delicious brown sauce.\n- Moo Goo Gai Pan - Tender white meat chicken, stir-fried with crisp snow pea pods, Napa, mushroom, water chestnuts, carrots, and bamboo shoots in white sauce.\nGreat:\n- Ginger veggies w shrimp - great! Good ginger flavor w generous shrimp, then long piece of onion, pepper, ginger\n- Moo shu w beef, chicken or whatever - great! Lots of veg, good flavor \n- Cashew chicken - great \n- Crazy Noodles - great, less sweet pad see ew \n- Thai cashew style sauce w chicken, medium spice - great, chicken banners and onion so not lots of veg but good flavor \n- Crab rangoon - typical, buttery, James liked. Had 2nd time just ok\n- Happy Family - good standard w lots of veg. Shrimp, beef, chicken, mushroom, water chestnuts, Napa, broccoli, snow pea pods, carrots, bamboo shoots, and baby corn sauteed in a brown sauce.\n- Green curry - I think this is the one I’ve liked in takeout. Red curry too spicy for me and even j. Didn’t like it with seafood option, chicken better. \nGood ok\n- Panng curry w beef - great! Like masaman curry, very coconut light color. Later j got it and said our red curry sauce we made (w mussels then chicken) was better \n- Dumplings “fine, not bad” said james \n- Pad see ew w beef - good, typical \n- Tiger tear beef salad - good, has a kick\nMeh\n- Orchid delight - good but a little sweet, maybe dad should try something else next time \n- Tom ka soup - too fishy, sour \n- Salad w peanut sauce - nothing special, chunky lettuce salad w chunky peanut sauce \n- Holy basil w chicken - too spicy, pepper spicy like that fish at chili spot \n- Garlic sauce w shrimp - bad sauce, more like sweet n sour, very little woodear mushrooms. But shrimp are cooked well. \nhttps://www.yelp.com/biz/siam-orchid-thai-restaurant-dublin\nhttps://siamorchidcolumbus.com/dublin-dublin-siam-orchid-thai-restaurant-food-menu"},{"id":"slurping-turtle","name":"Slurping turtle","kind":"restaurant","verdict":"good","closed":false,"location":"In Easton Mall","cuisine":["japanese","korean"],"people":["J"],"visits":[],"notes":"In Easton Mall\nJ got spicy miso ramen w duck fat chicken - good, kimchi-base broth\nI got red curry ramen - good flavor, would get again. Added fried chicken - didn’t like how they put all these crispy things in soup and they were soggy by time I got to them"},{"id":"so-gong-dong-tofu","name":"So Gong Dong Tofu","kind":"restaurant","verdict":"great","closed":false,"location":"3 min from apartment","cuisine":["seafood"],"people":[],"visits":[],"notes":"3 min from apartment\nBeef short ribs (LA kalbi) - good, small pieces but good flavor, maybe a little too sweet \nSeafood pancake - good, more soggy than crispy though \nJap chae noodles w beef vegetables - great flavor! Decent amount vegetables, very little meat \nSundubu jigae (tofu stew w mushrooms) - ok, small hot plate bowl so really hot, more tofu than soup, not any other ingredients except a few scallions. \nBeef (bulgogi) bimbibap great, stone plate when eating in (bring tempura next time)\nSoon dubu jigae (“Soon DOOboo JEEjay”) tofu stew w beef kimchi - like a soup-y version of mapo tofu \nOur pick up order came with sides: pickled cucumbers, tofu skin, kimchi, pickled daikon"},{"id":"song-lan","name":"Song Lan","kind":"restaurant","verdict":"great","closed":false,"location":"Sushi place in Dublin bridge park","cuisine":["japanese"],"people":[],"visits":[],"notes":"Sushi place in Dublin bridge park \nSalmon avocado roll - great, little rice\nEel avocado roll - great, little rice \n1 order of salmon sashimi (2 pieces) - great, fresh, thick slabs \nWhat are corinnas favorite rolls - Dragon roll (eel, avocado)"},{"id":"strongwater-food-and-spirits","name":"Strongwater Food and Spirits","kind":"restaurant","verdict":"meh","closed":false,"location":null,"cuisine":[],"people":["J"],"visits":[],"notes":"Meh. Close to downtown, ate outside by rusty trellis and cop chase\nBurrata starter tiny\nLoaded sweet potato bland \nJ said hot chicken sandwich not worth it\nDid have a good wine called Skins wine"},{"id":"sunflower-chinese-restaurant","name":"Sunflower Chinese restaurant","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":["chinese"],"people":["J","Mom"],"visits":[],"notes":"Great: \n- Good order for 5 of us: 2 orders beef chow fun, black bean chicken, Chinese broccoli, fried taro, egg tarts (would order different than Chinese broccoli next time for more leafs) \n- Hot pot beef - great. Comes in dish w brown sauce. Beef tender w collagen-enhancing tendons. Mixed w triangle tofu pieces and green onion\n- Shrimp in garlic sauce - great. Brown sauce, mixed w small mushrooms and green onion  \n- Chicken w black bean sauce - excellent! Great flavor, tender chicken (no veggies in it) Black bean sauce as good as Mom’s catfish \n- Beef chow fun - great but oily, wide noodles, good flavor, J likes \n- Szechuan eggplant - good, nice soft eggplant in garlic sauce, not spicy \n- Chive dumplings - great! Generous greens filling \n- Garlic beef - great! Great flavor sauce, beef sometimes tendon-y chewy. (No veggies in it)\n- Steamed bean curd wrap - good, James likes, filled with woodear mushroom \n- Fried taro - good\n- Turnip cake - oily but platonic \n- Chicken feet - great, platonic \n- Egg tart - great, platonic, sweet spot bw liquid and solid\nMeh:\n- Egg foo young w shrimp - great! But then later no flavor. Lots of filling of shrimp bean sprouts and generous sauce that is mellow and not sweet at all \n- Moo shu - too sweet. plum sauce stir fried in\n- Beef dumpling dim sum - meh\n- Zongzi dim sum - weird innards, carrots inside and a strange non-chines sausage \n- Shrimp sleeping bag - too much gelatinous, small shrimp, no sauce\n- Crab rangoon - ok, small bland filling, mostly friedness\n- Wonton soup - ok, dumplings very pasta-y\n- Mapo tofu (not spicy, j doesn’t like)\nSunflower spicy pork - good! Good flavor sauce, but not spicy at all. James disappointed."},{"id":"sunrise-asian-market","name":"Sunrise Asian market","kind":"market","verdict":"great","closed":false,"location":null,"cuisine":[],"people":["J"],"visits":[],"notes":"On Henderson Rd in strip mall w Marc’s, roosters, usps (not too far from tensuke)\nGreat! Big clean and new, lots of good produce. Got Taiwanese spinach and other Asian greens. (says light ginger sauce) - ok, not much flavor \nTry:\nMongolian beef \nRed curry chicken or shrimp \nSpicy wontons \nCrab rangoon - 100+ ratings\nLa Sichuan Beef \nSichuan green beans \nHot pepper chicken - 100+ ratings"},{"id":"taj-palace","name":"Taj Palace","kind":"restaurant","verdict":"ok","closed":false,"location":null,"cuisine":["indian"],"people":[],"visits":["2021-01-22"],"notes":"Ate 1/22/21 (bc Awahd was closed)\nOrdered navaratan korma, lamb biryani, dal tadka (yellow lentils)\nOk"},{"id":"tensuke-express-tensuke-eat-in","name":"Tensuke Express Tensuke eat in","kind":"restaurant","verdict":"great","closed":false,"location":null,"cuisine":[],"people":["J"],"visits":["2022-05-21"],"notes":"f-s 11-2:30\nOrder like a fast food restaurant, get your food when the puck vibrates\nTried it 5/21/22\nGot 2 sides: spicy pork kimchi (great, although more pork than kimchi) and beef and onion (ok)\nJ got a ramen that he liked, more fillings than soup, broth tasted dough-y"},{"id":"tensuke-japanese-market","name":"Tensuke Japanese market","kind":"market","verdict":"great","closed":false,"location":"10 min drive east","cuisine":["japanese"],"people":["J"],"visits":[],"notes":"10 min drive east \nIn the Kenny Center strip mall along w Asian bakeries \nGreat! Bought sushi grade salmon ($9 for a chunk), prepared sushi, sake, seafood of all kinds. Not huge store but stocked well w real Japanese goods \nSmall prepared sides good too:\nSquid near the raw salmon chunks \nBlack seaweed in the prepared meals area \nJames loves their prepared Mapo tofu"},{"id":"thai-2-go","name":"Thai 2 Go","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":["thai"],"people":[],"visits":[],"notes":"(On east side of town, did grub hub discount pickup, tiny hole in wall)\nCrab Rangoon - good, ample filling, thin crust\nDumplings - good flavor\nGreen curry w chicken - good flavor but sauce is watery, soupy \nPad see ew w beef - no sauce but really spicy"},{"id":"thai-gold l-shaped\nTurnip cake good, bit oily \nCrab Rangoon good, only 3 but well-filled\nChive dumpling w shrimp - ok good, pan fried, mom likes \nChicken feet - good \nFried bean curd roll - good, small tiny egg rolls w shrimp inside, mayo dip, mom liked \nGarlic eggplant dish - oily \nFried taro not as flavorful \nSoup dumplings nice thin skin but they don’t offer usual sauce - weird sweet vinegar \nWrinkly tofu skin ok, just mushroom veg inside\nShrimp w mushroom + onion stir fry in brown sauce good, like the onion\nShrimp scallops in white sauce just ok, mostly thick white noodles \nJ got Thai chow fun - ok\nSeared tuna salad - nope, tuna fine, salad not dressed at all, wasabi dressing tasteless."},{"id":"vaso","name":"VASO","kind":"restaurant","verdict":"meh","closed":false,"location":null,"cuisine":[],"people":[],"visits":[],"notes":"Rooftop restaurant in bridge park \nNice view, feels like fancy hotel vacation place but bad loud party music \nFood meh, had tiger shrimp and grilled cheese. Plus glass wine cost 60,"},{"id":"wendys","name":"Wendy’s","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":[],"people":[],"visits":[],"notes":"Apple pecan salad - pretty good if in mood for blue cheese, chicken, candied pecans. Pomegranate dressing quite sweet."},{"id":"whole-foods-buffet","name":"Whole Foods buffet","kind":"market","verdict":"good","closed":false,"location":null,"cuisine":[],"people":["J"],"visits":[],"notes":"Salad bar:\nSalmon - good \nSweet kale salad (I think that’s what it was) - tasty, like sweet balsamic vinegar on it w roasted red peppers, tasted like James’s favorite Italian sandwich when we ate near green-wood. Only available in winter"},{"id":"wild-ginger","name":"Wild Ginger","kind":"restaurant","verdict":"ok","closed":false,"location":"By Costco","cuisine":[],"people":["J"],"visits":[],"notes":"By Costco \nOk, but nice decor booth seating inside \nLunch special Ginger sauce w chicken and veg - meh sweet sauce w sushi ginger slab on top \nJ got peppercorn w beef, said ok, still feels Americanized"},{"id":"windchimes","name":"Windchimes","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":[],"people":["J"],"visits":[],"notes":"Cashew chicken - good, platonic w celery peppers cashews \nGarlic shrimp - good. W peppers celery \nMoo shoo beef - pretty good, little sweeter than preference bc hoisin inside but it’s decent \nGarlic shrimp - \nBeef in black bean sauce - too salty, but beef good\nJ had sechuan something, just ok\nGinger sauce is sweet and sour w ketchup, don’t do it \nNext time try egg foo young"},{"id":"xi-xia-western-chinese","name":"Xi Xia Western Chinese","kind":"restaurant","verdict":"great","closed":false,"location":"in Kenny center","cuisine":["chinese"],"people":["J"],"visits":[],"notes":"in Kenny center\nSalt pepper chicken appetizer - great! juicy chicken w great breaded five spice flavor\nDapanji noodles w thick noodles - pretty good. Has a kick, lots of bone in the bone in chicken. Good flavor. \nCurry just ok, really yellow, not Japanese curry flavor \nSpinach enoki mushroom stir fry - good but nothing special, stuck in teeth, could made it at home, nice vinegar taste \nJames loved his spicy lamb noodles \nSpicy thick noodles, ok\nJames really likes spicy noodles\nCurry chicken meh, yellow kind of curry \nTofu pudding fish filets - like mapo tofu, good but spicy \nSpicy chicken feet - for $15 got like 20! Good but too many"},{"id":"xin-wei","name":"Xin Wei","kind":"restaurant","verdict":"good","closed":false,"location":"Chinese takeout (small dingy inside) on Henderson Rd","cuisine":["chinese"],"people":[],"visits":[],"notes":"Chinese takeout (small dingy inside) on Henderson Rd \nEggplant w chicken lunch special - good, classic soft eggplant, soft chicken, sauce a little sweet"},{"id":"yf-chinese","name":"YF Chinese","kind":"restaurant","verdict":"good","closed":false,"location":null,"cuisine":["chinese"],"people":[],"visits":[],"notes":"Good and spicy. Lamb cumin really spicy. Fish filet. Eggplant. Fried dumplings. Chinese lettuce good and crispy, not tough."},{"id":"yun-nan-crossing-bridge-noodle","name":"Yun Nan crossing bridge noodle","kind":"restaurant","verdict":"good","closed":false,"location":"In Walmart strip mall","cuisine":[],"people":["J"],"visits":["2022-01-30"],"notes":"(In Walmart strip mall)\nAte in 1/30/22\nHad classic, James had kimchi soup \nPut all ingredients in \nAlso small dumplings \nGood, nothing special"}]</script>
<script>
(function () {
  'use strict';
  var ENTRIES = JSON.parse(document.getElementById('data').textContent);

  var VERDICT_ORDER = { great: 0, good: 1, ok: 2, meh: 3, bad: 4 };
  var MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];

  // "2021-01-02" and "2023-12" both read as "January 2021" / "December 2023".
  // The exact day was never the useful part.
  function monthLabel(iso) {
    var p = iso.split('-');
    return MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function visitLabels(visits) {
    var out = [];
    visits.forEach(function (v) {
      var l = monthLabel(v);
      if (out.indexOf(l) === -1) out.push(l);
    });
    return out;
  }

  // Fold accents and punctuation so “Chuy’s” matches "chuys".
  function norm(s) {
    return (s || '').toLowerCase().normalize('NFKD')
      .replace(/[̀-ͯ]/g, '').replace(/[’']/g, '').replace(/\s+/g, ' ');
  }

  // People are no longer shown or filterable, but keeping them in the search
  // index means "mom" still finds the meals she was there for.
  ENTRIES.forEach(function (e) {
    e._hay = norm([e.name, e.notes, e.location, e.cuisine.join(' '),
                   e.people.join(' '), e.people.indexOf('J') > -1 ? 'james' : '',
                   e.kind, e.verdict, e.visits.join(' '),
                   visitLabels(e.visits).join(' ')].join(' \n '));
  });

  var state = { q: '', verdict: new Set(), cuisine: new Set(), kind: new Set() };

  function counts(field) {
    var c = {};
    ENTRIES.forEach(function (e) {
      var vals = Array.isArray(e[field]) ? e[field] : (e[field] ? [e[field]] : []);
      vals.forEach(function (v) { c[v] = (c[v] || 0) + 1; });
    });
    return c;
  }

  var GROUPS = [
    { key: 'verdict', label: 'Verdict', order: function (a, b) { return VERDICT_ORDER[a] - VERDICT_ORDER[b]; } },
    { key: 'cuisine', label: 'Food' },
    { key: 'kind',    label: 'Kind' },
  ];

  var filtersEl = document.getElementById('filters');
  GROUPS.forEach(function (g) {
    var c = counts(g.key);
    var keys = Object.keys(c);
    if (keys.length < 2) return;
    keys.sort(g.order || function (a, b) { return c[b] - c[a] || a.localeCompare(b); });

    var label = document.createElement('span');
    label.className = 'grouplabel';
    label.textContent = g.label;
    filtersEl.appendChild(label);

    var row = document.createElement('div');
    row.className = 'chips';
    filtersEl.appendChild(row);

    keys.forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.dataset.group = g.key;
      b.dataset.value = k;
      b.innerHTML = esc(k) + '<span class="n">' + c[k] + '</span>';
      b.addEventListener('click', function () {
        // One filter at a time: any click clears the rest, and clicking the
        // active chip turns it off.
        var wasOn = state[g.key].has(k);
        GROUPS.forEach(function (gg) { state[gg.key].clear(); });
        if (!wasOn) state[g.key].add(k);
        syncChips();
        render();
      });
      row.appendChild(b);
    });
  });

  function syncChips() {
    Array.prototype.forEach.call(filtersEl.querySelectorAll('.chip'), function (b) {
      b.setAttribute('aria-pressed', String(state[b.dataset.group].has(b.dataset.value)));
    });
  }

  function matches(e) {
    for (var i = 0; i < GROUPS.length; i++) {
      var key = GROUPS[i].key, sel = state[key];
      if (!sel.size) continue;
      var vals = Array.isArray(e[key]) ? e[key] : (e[key] ? [e[key]] : []);
      var any = false;
      sel.forEach(function (v) { if (vals.indexOf(v) > -1) any = true; });
      if (!any) return false;
    }
    if (!state.q) return true;
    return terms(state.q).every(function (t) { return e._hay.indexOf(t) > -1; });
  }

  function terms(q) {
    var out = [], re = /"([^"]+)"|(\S+)/g, m;
    while ((m = re.exec(q))) out.push(norm(m[1] || m[2]));
    return out.filter(Boolean);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function linkify(html) {
    return html.replace(/(https?:\/\/[^\s<]+)/g, function (u) {
      var clean = u.replace(/[).,]+$/, '');
      return '<a href="' + clean + '" rel="noopener">' + clean.replace(/^https?:\/\//, '') + '</a>';
    });
  }

  function highlight(html, ts) {
    if (!ts.length) return html;
    ts.forEach(function (t) {
      if (t.length < 2) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      html = html.replace(/(<[^>]*>)|([^<]+)/g, function (_, tag, text) {
        return tag || text.replace(re, '<mark>$1</mark>');
      });
    });
    return html;
  }

  function titleCase(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function card(e, ts) {
    var d = document.createElement('article');
    d.className = 'card';
    d.id = e.id;

    var bits = [];
    if (e.verdict) bits.push('<span class="verdict v-' + e.verdict + '">' + e.verdict + '</span>');
    if (e.closed) bits.push('<span class="closed">Closed</span>');

    // One bullet-separated line: "Indian • By Meijer • January 2021"
    var meta = e.cuisine.map(titleCase);
    if (e.kind === 'market') meta.push('Market');
    if (e.location) meta.push(e.location);
    visitLabels(e.visits).forEach(function (v) { meta.push(v); });

    d.innerHTML =
      '<div class="cardhead"><h2 class="name"><a href="#' + esc(e.id) + '">' +
        highlight(esc(e.name), ts) + '</a></h2>' + bits.join('') + '</div>' +
      (meta.length ? '<div class="meta">' +
        meta.map(esc).join('<span class="sep">•</span>') + '</div>' : '') +
      '<div class="notes">' + highlight(linkify(esc(e.notes)), ts) + '</div>';

    var notes = d.querySelector('.notes');
    if (!ts.length && e.notes.split('\n').length > 9) {
      notes.classList.add('clamped');
      var more = document.createElement('button');
      more.className = 'more';
      more.type = 'button';
      more.textContent = 'Read all of it';
      more.addEventListener('click', function () {
        notes.classList.remove('clamped');
        more.remove();
      });
      d.appendChild(more);
    }
    return d;
  }

  var resultsEl = document.getElementById('results');
  var countEl = document.getElementById('count');

  function render() {
    var ts = terms(state.q);
    var list = ENTRIES.filter(matches);

    countEl.innerHTML = '<b>' + list.length + '</b> ' +
      (list.length === 1 ? 'place' : 'places') +
      (list.length < ENTRIES.length ? ' of ' + ENTRIES.length : '');

    resultsEl.textContent = '';
    if (!list.length) {
      resultsEl.innerHTML = '<div class="empty"><b>Nothing here.</b>' +
        'C. has not eaten that, or has not written it down.</div>';
      syncURL();
      return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (e) { frag.appendChild(card(e, ts)); });
    resultsEl.appendChild(frag);
    syncURL();
  }

  function syncURL() {
    var p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    GROUPS.forEach(function (g) {
      if (state[g.key].size) p.set(g.key, Array.from(state[g.key]).join(','));
    });
    var qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  function restore() {
    var p = new URLSearchParams(location.search);
    state.q = p.get('q') || '';
    document.getElementById('q').value = state.q;
    for (var i = 0; i < GROUPS.length; i++) {
      var g = GROUPS[i];
      var v = (p.get(g.key) || '').split(',').filter(Boolean)[0];
      if (v) { state[g.key].add(v); break; }
    }
    syncChips();
  }

  var input = document.getElementById('q');
  input.addEventListener('input', function () { state.q = input.value.trim(); render(); });

  document.getElementById('rand').addEventListener('click', function () {
    var pool = ENTRIES.filter(matches);
    if (!pool.length) pool = ENTRIES;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    location.hash = pick.id;
    var el = document.getElementById(pick.id);
    if (el) el.scrollIntoView({ block: 'center' });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && document.activeElement !== input) { ev.preventDefault(); input.focus(); }
    if (ev.key === 'Escape' && document.activeElement === input) { input.value = ''; state.q = ''; render(); }
  });

  restore();
  render();

  if (location.hash) {
    var el = document.getElementById(location.hash.slice(1));
    if (el) el.scrollIntoView({ block: 'center' });
  }
})();
</script>
